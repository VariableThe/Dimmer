name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # macOS 15 is the current stable GitHub-hosted macOS image. Pinning the
    # version prevents an unreviewed macOS/Xcode migration from changing CI.
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build --configuration debug

      - name: Test
        run: swift test --parallel
